# PDFFlow — production overlay. Layers TLS termination onto the base stack.
#
# Run from the repository root:
#   docker compose --env-file .env \
#                  -f infrastructure/docker-compose.yml \
#                  -f infrastructure/docker-compose.prod.yml up -d --build
#
# `--env-file .env` is not optional. Passing two -f flags moves Compose's
# project directory to infrastructure/, so it stops discovering the .env at
# the repository root. Without the flag every ${VAR:-default} in the base file
# silently falls back to its development default — including
# POSTGRES_PASSWORD, which means a fresh volume initialises with the well
# known default password and the stack comes up looking perfectly healthy.
#
# First certificate — DNS must already point at this host, and the stack must
# be up so that nginx can serve the challenge:
#
#   docker compose --env-file .env \
#     -f infrastructure/docker-compose.yml -f infrastructure/docker-compose.prod.yml \
#     run --rm certbot certonly --webroot -w /var/www/certbot \
#         -d pdfflow.bondeth.site --email you@example.com --agree-tos --no-eff-email
#
# Add --dry-run first to rehearse against the staging CA. Let's Encrypt rate
# limits failed real issuances hard, so rehearsing is worth the extra minute.

name: pdfflow

services:
  nginx:
    ports:
      # Port 80 is already published by the base file via ${HTTP_PORT}.
      - "${HTTPS_PORT:-443}:443"
    volumes:
      # Same target path as the base mount, so this replaces it rather than
      # adding a second config directory.
      - ./nginx/conf.d.tls:/etc/nginx/conf.d:ro
      # The whole certbot tree, not just live/ — the files there are symlinks
      # into ../../archive/ and dangle if archive/ is not also mounted.
      - ${LETSENCRYPT_DIR:-./letsencrypt}:/etc/letsencrypt:ro
      - ${ACME_WEBROOT:-./certbot-webroot}:/var/www/certbot:ro
    # A renewed certificate is only picked up on reload. Rather than give
    # certbot a deploy hook that needs the Docker socket, nginx reloads itself
    # every 6h — cheap, and it means neither container has to reach into the
    # other. The $$ escapes Compose's own interpolation.
    command: >-
      sh -c 'while :; do sleep 6h & wait $${!}; nginx -s reload; done & nginx -g "daemon off;"'

  certbot:
    image: certbot/certbot:latest
    volumes:
      - ${LETSENCRYPT_DIR:-./letsencrypt}:/etc/letsencrypt
      - ${ACME_WEBROOT:-./certbot-webroot}:/var/www/certbot
    # Wakes twice a day and renews anything inside its 30-day window; a no-op
    # otherwise. Twice daily is what Let's Encrypt asks for — it gives a
    # month of retries before an expiry actually bites.
    entrypoint: >-
      sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done'
    depends_on:
      - nginx
    restart: unless-stopped
