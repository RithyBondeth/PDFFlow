# PDFFlow — full stack.
# Run from the repository root:  docker compose -f infrastructure/docker-compose.yml up
# (or simply `docker compose up`, thanks to the root compose.yaml shim)

name: pdfflow

x-backend-env: &backend-env
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-pdfflow}:${POSTGRES_PASSWORD:-pdfflow}@postgres:5432/${POSTGRES_DB:-pdfflow}
  REDIS_URL: redis://redis:6379/0
  STORAGE_ROOT: /data/storage
  ENVIRONMENT: ${ENVIRONMENT:-development}
  DEBUG: ${DEBUG:-false}
  MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-104857600}
  FILE_TTL_MINUTES: ${FILE_TTL_MINUTES:-30}
  CLEANUP_INTERVAL_SECONDS: ${CLEANUP_INTERVAL_SECONDS:-300}
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080,http://localhost:3000}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pdfflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pdfflow}
      POSTGRES_DB: ${POSTGRES_DB:-pdfflow}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pdfflow} -d ${POSTGRES_DB:-pdfflow}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory-policy", "noeviction"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  migrate:
    build:
      context: ..
      dockerfile: backend/Dockerfile
      target: api
    environment: *backend-env
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: ..
      dockerfile: backend/Dockerfile
      target: api
    environment: *backend-env
    volumes:
      # Shared with the worker: the API writes uploads, the worker reads them
      # and writes results back. tmpfs keeps user documents off durable disk.
      - storage:/data/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  worker:
    build:
      context: ..
      dockerfile: backend/Dockerfile
      target: worker
    environment: *backend-env
    volumes:
      - storage:/data/storage
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      # CMD-SHELL, not CMD: the exec form has no shell, so $$HOSTNAME would
      # be passed literally and the ping would never match a live node.
      test: ["CMD-SHELL", "celery -A app.worker.celery_app.celery_app inspect ping -d celery@$$HOSTNAME"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  beat:
    # The cleanup scheduler. Exactly one replica — a second beat would double
    # every scheduled sweep.
    build:
      context: ..
      dockerfile: backend/Dockerfile
      target: worker
    environment: *backend-env
    command:
      ["celery", "-A", "app.worker.celery_app.celery_app", "beat",
       "--loglevel=info", "--schedule=/tmp/celerybeat-schedule"]
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    environment:
      # Browser traffic goes through nginx (relative), server-side rendering
      # talks to the API container directly.
      NUXT_PUBLIC_API_BASE: /api
      NUXT_API_INTERNAL: http://api:8000/api
      NITRO_PORT: "3000"
      NITRO_HOST: "0.0.0.0"
    depends_on:
      - api
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      - api
      - frontend
    restart: unless-stopped

volumes:
  postgres-data:
  storage:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      # Temporary documents live in RAM and vanish with the container, which is
      # the strongest form of "we do not keep your files".
      #
      # uid/gid must match the unprivileged `pdfflow` user in the backend image:
      # the mount overlays the image's chowned directory, so without these the
      # API and worker cannot write to their own storage root.
      o: size=2g,mode=0700,uid=10001,gid=10001
