user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  2048;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # A job id is a bearer capability: anyone holding it can fetch that result
    # until it expires (docs/security.md §5). Logging $request verbatim writes
    # every download token to disk, where it outlives the 30-minute TTL and
    # travels to wherever logs are shipped. Redact the id and keep the shape,
    # so the logs still show what was requested and how it went.
    map $request_uri $safe_request_uri {
        default                                          $request_uri;
        "~*^/api/download/[0-9a-f-]{36}(?<dl_tail>.*)$"   "/api/download/[id]$dl_tail";
        "~*^/api/jobs/[0-9a-f-]{36}(?<job_tail>.*)$"      "/api/jobs/[id]$job_tail";
    }

    log_format  main  '$remote_addr - $status "$request_method $safe_request_uri $server_protocol" '
                      '$body_bytes_sent "$http_user_agent" ${request_time}s';
    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout  65;
    server_tokens   off;

    # Large enough for the biggest allowed upload plus multipart overhead.
    client_max_body_size 128m;
    client_body_timeout  120s;
    client_body_buffer_size 1m;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    include /etc/nginx/conf.d/*.conf;
}
