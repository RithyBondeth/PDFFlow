# Upstreams are resolved per request via Docker's embedded DNS rather than
# once at startup. With a static `upstream` block nginx caches the container
# IP forever, so recreating `api` (any rebuild or `up -d`) leaves nginx
# returning 502 until it is manually restarted.
#
# The cost is upstream keepalive, which a variable proxy_pass cannot use.
# Correctness across restarts is worth more than the saved handshakes here.
resolver 127.0.0.11 valid=10s ipv6=off;

# A second bucket in front of the app-level limiter: cheap protection that
# never reaches Python.
limit_req_zone $binary_remote_addr zone=uploads:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=general:10m rate=300r/m;

server {
    listen 80;
    server_name _;

    set $api_upstream      api:8000;
    set $frontend_upstream frontend:3000;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location = /api/upload {
        limit_req zone=uploads burst=10 nodelay;
        proxy_pass http://$api_upstream;
        proxy_request_buffering off;   # stream straight through to FastAPI
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Server-Sent Events: buffering here would hold every progress frame until
    # the job finished, which defeats the point.
    location ~ ^/api/jobs/[^/]+/events$ {
        proxy_pass http://$api_upstream;
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 3600s;
    }

    location /api/download/ {
        proxy_pass http://$api_upstream;
        proxy_buffering off;
        proxy_read_timeout 300s;
        add_header Cache-Control "no-store" always;
    }

    location /api/ {
        limit_req zone=general burst=60 nodelay;
        proxy_pass http://$api_upstream;
    }

    location ~ ^/(docs|redoc|openapi.json)$ {
        proxy_pass http://$api_upstream;
    }

    location / {
        limit_req zone=general burst=100 nodelay;
        proxy_pass http://$frontend_upstream;
    }
}
