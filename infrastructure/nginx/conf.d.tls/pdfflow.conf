# PDFFlow — production server config, TLS terminated here.
#
# This directory is mounted over /etc/nginx/conf.d *instead of* ../conf.d when
# the stack is started with docker-compose.prod.yml. The plain-HTTP config next
# door stays as it is for local development, which has no certificates.
#
# Expects the whole certbot tree mounted at /etc/letsencrypt — not just the
# live/ directory. The files under live/ are symlinks into ../../archive/, so
# mounting live/ alone gives nginx dangling links and no certificate.
#
# Upstreams are resolved per request via Docker's embedded DNS rather than
# once at startup. With a static `upstream` block nginx caches the container
# IP forever, so recreating `api` (any rebuild or `up -d`) leaves nginx
# returning 502 until it is manually restarted.
resolver 127.0.0.11 valid=10s ipv6=off;

# A second bucket in front of the app-level limiter: cheap protection that
# never reaches Python.
limit_req_zone $binary_remote_addr zone=uploads:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=general:10m rate=300r/m;

# --- port 80: ACME challenges and redirect, nothing else -------------------
server {
    listen 80;
    server_name pdfflow.bondeth.site;

    # Certbot's webroot challenge must stay reachable over plain HTTP, or
    # renewal fails once the redirect below is in place.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- port 443: the application --------------------------------------------
server {
    listen 443 ssl;
    http2 on;
    server_name pdfflow.bondeth.site;

    ssl_certificate     /etc/letsencrypt/live/pdfflow.bondeth.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pdfflow.bondeth.site/privkey.pem;

    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       1d;
    ssl_session_tickets       off;

    set $api_upstream      api:8000;
    set $frontend_upstream frontend:3000;

    # NOTE: add_header does not accumulate across levels — a location that
    # sets any header of its own loses every header set here. The two
    # locations below that need their own Cache-Control therefore repeat
    # this block rather than inheriting it. Keep them in sync.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location = /api/upload {
        limit_req zone=uploads burst=10 nodelay;
        proxy_pass http://$api_upstream;
        proxy_request_buffering off;   # stream straight through to FastAPI
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Server-Sent Events: buffering here would hold every progress frame until
    # the job finished, which defeats the point.
    location ~ ^/api/jobs/[^/]+/events$ {
        proxy_pass http://$api_upstream;
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 3600s;
    }

    location /api/download/ {
        proxy_pass http://$api_upstream;
        proxy_buffering off;
        proxy_read_timeout 300s;

        add_header Cache-Control "no-store" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    }

    location /api/ {
        limit_req zone=general burst=60 nodelay;
        proxy_pass http://$api_upstream;
    }

    location ~ ^/(docs|redoc|openapi.json)$ {
        proxy_pass http://$api_upstream;
    }

    location / {
        limit_req zone=general burst=100 nodelay;
        proxy_pass http://$frontend_upstream;
    }
}
