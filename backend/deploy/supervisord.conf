[supervisord]
nodaemon=true
logfile=/tmp/supervisord.log
pidfile=/tmp/supervisord.pid
user=root

[program:api]
command=uvicorn app.main:app --host 0.0.0.0 --port=%(ENV_PORT)s
directory=/app
user=pdfflow
environment=HOME="/home/pdfflow"
priority=10
autorestart=true
startretries=10
stopsignal=TERM
stopasgroup=true
killasgroup=true
stopwaitsecs=300
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:worker]
command=celery -A app.worker.celery_app.celery_app worker --loglevel=info --queues=pdf,maintenance --concurrency=2
directory=/app
user=pdfflow
environment=HOME="/home/pdfflow"
priority=20
autorestart=true
startretries=10
stopsignal=TERM
stopasgroup=true
killasgroup=true
stopwaitsecs=300
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:beat]
command=celery -A app.worker.celery_app.celery_app beat --loglevel=info --schedule=/tmp/celerybeat-schedule
directory=/app
user=pdfflow
environment=HOME="/home/pdfflow"
priority=30
autorestart=true
startretries=10
stopsignal=TERM
stopasgroup=true
killasgroup=true
stopwaitsecs=300
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
